<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Рабочий стол</title>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      font-family: 'Lexend', 'Segoe UI', Tahoma, sans-serif;
      -webkit-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    /* ── Фон ── */
    #bg {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 0;
      background-image: url('./background9.jpg');
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      background-color: #1a1a2e;
    }

    /* ── Менюбар ── */
    #menubar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 30px;
      z-index: 100;
      background: rgba(220, 220, 220, 0.80);
      display: -ms-flexbox;
      display: flex;
      -ms-flex-align: center;
      align-items: center;
      padding: 0 14px;
    }

    #clock {
      position: absolute;
      left: 50%;
      top: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
      font-size: 13px;
      color: #111;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }

    #menubar-icons {
      margin-left: auto;
      display: -ms-flexbox;
      display: flex;
      -ms-flex-align: center;
      align-items: center;
    }
    #menubar-icons svg {
      margin-left: 14px;
      opacity: 0.8;
    }

    /* ── Базовый стиль виджетов ── */
    .widget {
      position: fixed;
      z-index: 10;
      background: rgba(30, 30, 50, 0.62);
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.35);
      font-family: 'Segoe UI', Tahoma, sans-serif;
    }

    /* ── Календарь ── */
    #cal-widget {
      top: 46px;
      left: 20px;
      width: 230px;
      padding: 16px 14px 12px;
    }

    #cal-header {
      display: -ms-flexbox;
      display: flex;
      -ms-flex-pack: justify;
      justify-content: space-between;
      -ms-flex-align: end;
      align-items: flex-end;
      margin-bottom: 10px;
      padding: 0 2px;
    }


    #cal-nav {
      display: -ms-flexbox;
      display: flex;
      -ms-flex-align: center;
      align-items: center;
    }

    .cal-arrow {
      width: 22px;
      height: 22px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      outline: none;
      background: transparent;
      color: rgba(255, 255, 255, 0.72);
      cursor: pointer;
      font-family: Arial, sans-serif;
      font-size: 11px;
      line-height: 22px;
      text-align: center;
    }

    .cal-arrow:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.18);
    }

    #cal-month {
      min-width: 86px;
      text-align: center;
      font-size: 15px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.95);
      letter-spacing: 0.2px;
    }
    #cal-year {
      font-size: 13px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.55);
    }

    #cal-dow {
      display: -ms-flexbox;
      display: flex;
      -ms-flex-pack: distribute;
      justify-content: space-around;
      margin-bottom: 4px;
      font-size: 10px;
      color: rgba(255,255,255,0.4);
    }
    #cal-dow span {
      text-align: center;
      font-size: 10px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.4);
      padding-bottom: 4px;
    }
    #cal-dow span:nth-child(6) { color: rgba(255, 255, 255, 0.5); }
    #cal-dow span:nth-child(7) { color: rgba(255, 100, 100, 0.65); }

    #cal-days {
      display: -ms-grid;
      display: grid;
      -ms-grid-columns: 1fr 1fr 1fr 1fr 1fr 1fr 1fr;
      grid-template-columns: repeat(7, 1fr);
    }

    .cal-day {
      display: -ms-flexbox;
      display: flex;
      -ms-flex-align: center;
      align-items: center;
      -ms-flex-pack: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      margin: 1px auto;
      border-radius: 50%;
      font-size: 12px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.82);
    }
    .cal-day.today {
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      background: rgba(255, 255, 255, 0.30);
      box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.5), 0 2px 8px rgba(0,0,0,0.2);
    }
    .cal-day.sunday { color: rgba(255, 100, 100, 0.8); }

    /* ── QR виджет ── */
    #qr-widget {
      top: 310px;
      left: 20px;
      width: 230px;
      padding: 14px;
      display: -ms-flexbox;
      display: flex;
      -ms-flex-direction: column;
      flex-direction: column;
      -ms-flex-align: center;
      align-items: center;
    }

    #qr-widget img {
      width: 150px;
      height: 150px;
      border-radius: 8px;
    }

    #qr-caption {
      margin-top: 10px;
      text-align: center;
      display: -ms-flexbox;
      display: flex;
      -ms-flex-direction: column;
      flex-direction: column;
      -ms-flex-align: center;
      align-items: center;
    }

    #qr-title {
      font-size: 12px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.9);
    }

    #qr-email {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.5);
      margin-top: 3px;
    }

    /* ── Панель приложений ── */
    #app-panel {
      top: 46px;
      right: 20px;
      width: 96px;
      padding: 12px 10px;
      display: -ms-flexbox;
      display: flex;
      -ms-flex-direction: column;
      flex-direction: column;
      -ms-flex-align: center;
      align-items: center;
    }

    #app-panel-2 {
      top: 400px; /* подбери под высоту первой панели */
      right: 20px;
      padding: 12px 10px;
      display: -ms-flexbox;
      display: flex;
      -ms-flex-direction: column;
      flex-direction: column;
      -ms-flex-align: center;
      align-items: center;
    }

    .app-icon {
      pointer-events: auto;
      cursor: pointer;
      text-decoration: none;
      display: -ms-flexbox;
      display: flex;
      -ms-flex-direction: column;
      flex-direction: column;
      -ms-flex-align: center;
      align-items: center;
      margin-bottom: 10px;
    }
    .app-icon:last-child { margin-bottom: 0; }

    .app-icon img {
      width: 56px;
      height: 56px;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.3));
      -webkit-transition: -webkit-transform 0.12s;
      transition: transform 0.12s;
    }

    .app-icon span {
      font-size: 10px;
      color: #fff;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
      margin-top: 4px;
    }


    /* ── Реалистичные падающие и накопившиеся листья ── */
    #leaves-layer {
      position: fixed;
      top: 30px;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 5;
      overflow: hidden;
      pointer-events: none;
    }

    .leaf {
      position: absolute;
      width: 18px;
      height: 21px;
      opacity: 0.88;
      pointer-events: none;
    }

    .leaf-surface {
      position: absolute;
      left: 20%;
      top: 2%;
      width: 62%;
      height: 72%;
      background: currentColor;
      border-radius: 82% 12% 78% 10%;
      box-shadow:
        inset 2px 2px 3px rgba(255, 225, 145, 0.30),
        inset -2px -2px 3px rgba(85, 40, 10, 0.30),
        0 2px 3px rgba(0, 0, 0, 0.22);
      -webkit-transform: rotate(45deg);
      transform: rotate(45deg);
    }

    .leaf-surface:before,
    .leaf-surface:after {
      content: '';
      position: absolute;
      top: 27%;
      width: 72%;
      height: 62%;
      background: currentColor;
      border-radius: 80% 12% 75% 15%;
      box-shadow:
        inset 1px 1px 2px rgba(255, 225, 145, 0.20),
        inset -1px -1px 2px rgba(85, 40, 10, 0.22);
    }

    .leaf-surface:before {
      left: -38%;
      -webkit-transform: rotate(-32deg);
      transform: rotate(-32deg);
    }

    .leaf-surface:after {
      right: -38%;
      -webkit-transform: rotate(32deg);
      transform: rotate(32deg);
    }

    .leaf-shape-oval .leaf-surface {
      left: 14%;
      width: 70%;
      height: 78%;
      border-radius: 95% 10% 92% 8%;
    }

    .leaf-shape-oval .leaf-surface:before,
    .leaf-shape-oval .leaf-surface:after {
      display: none;
    }

    .leaf-vein {
      position: absolute;
      left: 49%;
      top: 9%;
      width: 1px;
      height: 82%;
      background: rgba(90, 48, 15, 0.52);
    }

    .leaf-vein:before,
    .leaf-vein:after {
      content: '';
      position: absolute;
      left: -5px;
      width: 6px;
      height: 1px;
      background: rgba(90, 48, 15, 0.40);
      -webkit-transform-origin: right center;
      transform-origin: right center;
    }

    .leaf-vein:before {
      top: 35%;
      -webkit-transform: rotate(35deg);
      transform: rotate(35deg);
    }

    .leaf-vein:after {
      top: 61%;
      -webkit-transform: rotate(-32deg);
      transform: rotate(-32deg);
    }

    .leaf-stem {
      position: absolute;
      left: 49%;
      top: 67%;
      width: 1px;
      height: 31%;
      background: #70451f;
      -webkit-transform: rotate(-22deg);
      transform: rotate(-22deg);
      -webkit-transform-origin: top center;
      transform-origin: top center;
    }

    .leaf-gold   { color: #c99a32; }
    .leaf-amber  { color: #d17b25; }
    .leaf-orange { color: #bd5b25; }
    .leaf-red    { color: #9e3c2b; }
    .leaf-brown  { color: #79502a; }
    .leaf-olive  { color: #8d812f; }

    .falling-leaf {
      top: -45px;
      -webkit-animation-timing-function: linear;
      animation-timing-function: linear;
      -webkit-animation-iteration-count: 1;
      animation-iteration-count: 1;
      -webkit-animation-fill-mode: both;
      animation-fill-mode: both;
    }

    .leaf-path-slow {
      -webkit-animation-name: leaf-fall-slow;
      animation-name: leaf-fall-slow;
    }

    .leaf-path-spiral-left {
      -webkit-animation-name: leaf-fall-spiral-left;
      animation-name: leaf-fall-spiral-left;
    }

    .leaf-path-spiral-right {
      -webkit-animation-name: leaf-fall-spiral-right;
      animation-name: leaf-fall-spiral-right;
    }

    .leaf-path-glide-left {
      -webkit-animation-name: leaf-fall-glide-left;
      animation-name: leaf-fall-glide-left;
    }

    .leaf-path-glide-right {
      -webkit-animation-name: leaf-fall-glide-right;
      animation-name: leaf-fall-glide-right;
    }

    .leaf-path-tumble {
      -webkit-animation-name: leaf-fall-tumble;
      animation-name: leaf-fall-tumble;
    }

    .settled-leaf {
      top: auto;
      -webkit-animation: none;
      animation: none;
      opacity: 0.92;
    }

    .stream-leaf {
      left: 103%;
      -webkit-animation-timing-function: ease-in-out;
      animation-timing-function: ease-in-out;
      -webkit-animation-iteration-count: 1;
      animation-iteration-count: 1;
      -webkit-animation-fill-mode: forwards;
      animation-fill-mode: forwards;
    }

    .leaf-stream-up {
      -webkit-animation-name: leaf-stream-up;
      animation-name: leaf-stream-up;
    }

    .leaf-stream-down {
      -webkit-animation-name: leaf-stream-down;
      animation-name: leaf-stream-down;
    }

    @-webkit-keyframes leaf-fall-slow {
      0%   { top: -45px; margin-left: 0;     -webkit-transform: rotate(0deg) scaleY(1); }
      15%  {              margin-left: 26px; -webkit-transform: rotate(45deg) scaleY(0.62); }
      31%  {              margin-left: -18px;-webkit-transform: rotate(95deg) scaleY(0.92); }
      48%  {              margin-left: 34px; -webkit-transform: rotate(150deg) scaleY(0.48); }
      65%  {              margin-left: -25px;-webkit-transform: rotate(215deg) scaleY(0.88); }
      82%  {              margin-left: 20px; -webkit-transform: rotate(285deg) scaleY(0.55); }
      100% { top: 103%;   margin-left: -8px; -webkit-transform: rotate(350deg) scaleY(0.84); }
    }

    @keyframes leaf-fall-slow {
      0%   { top: -45px; margin-left: 0;     transform: rotate(0deg) scaleY(1); }
      15%  {              margin-left: 26px; transform: rotate(45deg) scaleY(0.62); }
      31%  {              margin-left: -18px;transform: rotate(95deg) scaleY(0.92); }
      48%  {              margin-left: 34px; transform: rotate(150deg) scaleY(0.48); }
      65%  {              margin-left: -25px;transform: rotate(215deg) scaleY(0.88); }
      82%  {              margin-left: 20px; transform: rotate(285deg) scaleY(0.55); }
      100% { top: 103%;   margin-left: -8px; transform: rotate(350deg) scaleY(0.84); }
    }

    @-webkit-keyframes leaf-fall-spiral-left {
      0%   { top: -45px; margin-left: 0;      -webkit-transform: rotate(0deg) scaleY(1); }
      14%  {              margin-left: 75px;  -webkit-transform: rotate(120deg) scaleY(0.32); }
      29%  {              margin-left: 8px;   -webkit-transform: rotate(245deg) scaleY(0.94); }
      44%  {              margin-left: -82px; -webkit-transform: rotate(370deg) scaleY(0.28); }
      60%  {              margin-left: -12px; -webkit-transform: rotate(510deg) scaleY(0.90); }
      76%  {              margin-left: 92px;  -webkit-transform: rotate(650deg) scaleY(0.35); }
      90%  {              margin-left: 18px;  -webkit-transform: rotate(790deg) scaleY(0.86); }
      100% { top: 103%;   margin-left: -34px; -webkit-transform: rotate(900deg) scaleY(0.50); }
    }

    @keyframes leaf-fall-spiral-left {
      0%   { top: -45px; margin-left: 0;      transform: rotate(0deg) scaleY(1); }
      14%  {              margin-left: 75px;  transform: rotate(120deg) scaleY(0.32); }
      29%  {              margin-left: 8px;   transform: rotate(245deg) scaleY(0.94); }
      44%  {              margin-left: -82px; transform: rotate(370deg) scaleY(0.28); }
      60%  {              margin-left: -12px; transform: rotate(510deg) scaleY(0.90); }
      76%  {              margin-left: 92px;  transform: rotate(650deg) scaleY(0.35); }
      90%  {              margin-left: 18px;  transform: rotate(790deg) scaleY(0.86); }
      100% { top: 103%;   margin-left: -34px; transform: rotate(900deg) scaleY(0.50); }
    }

    @-webkit-keyframes leaf-fall-spiral-right {
      0%   { top: -45px; margin-left: 0;      -webkit-transform: rotate(15deg) scaleY(0.90); }
      15%  {              margin-left: -78px; -webkit-transform: rotate(-125deg) scaleY(0.30); }
      30%  {              margin-left: -5px;  -webkit-transform: rotate(-255deg) scaleY(0.96); }
      46%  {              margin-left: 86px;  -webkit-transform: rotate(-390deg) scaleY(0.26); }
      61%  {              margin-left: 14px;  -webkit-transform: rotate(-525deg) scaleY(0.88); }
      77%  {              margin-left: -94px; -webkit-transform: rotate(-665deg) scaleY(0.34); }
      91%  {              margin-left: -16px; -webkit-transform: rotate(-800deg) scaleY(0.82); }
      100% { top: 103%;   margin-left: 38px;  -webkit-transform: rotate(-910deg) scaleY(0.48); }
    }

    @keyframes leaf-fall-spiral-right {
      0%   { top: -45px; margin-left: 0;      transform: rotate(15deg) scaleY(0.90); }
      15%  {              margin-left: -78px; transform: rotate(-125deg) scaleY(0.30); }
      30%  {              margin-left: -5px;  transform: rotate(-255deg) scaleY(0.96); }
      46%  {              margin-left: 86px;  transform: rotate(-390deg) scaleY(0.26); }
      61%  {              margin-left: 14px;  transform: rotate(-525deg) scaleY(0.88); }
      77%  {              margin-left: -94px; transform: rotate(-665deg) scaleY(0.34); }
      91%  {              margin-left: -16px; transform: rotate(-800deg) scaleY(0.82); }
      100% { top: 103%;   margin-left: 38px;  transform: rotate(-910deg) scaleY(0.48); }
    }

    @-webkit-keyframes leaf-fall-glide-left {
      0%   { top: -45px; margin-left: 0;      -webkit-transform: rotate(20deg) scaleY(0.85); }
      20%  {              margin-left: -38px; -webkit-transform: rotate(-35deg) scaleY(0.48); }
      42%  {              margin-left: -92px; -webkit-transform: rotate(35deg) scaleY(0.92); }
      63%  {              margin-left: -148px;-webkit-transform: rotate(-25deg) scaleY(0.42); }
      82%  {              margin-left: -205px;-webkit-transform: rotate(40deg) scaleY(0.88); }
      100% { top: 103%;   margin-left: -255px;-webkit-transform: rotate(-10deg) scaleY(0.58); }
    }

    @keyframes leaf-fall-glide-left {
      0%   { top: -45px; margin-left: 0;      transform: rotate(20deg) scaleY(0.85); }
      20%  {              margin-left: -38px; transform: rotate(-35deg) scaleY(0.48); }
      42%  {              margin-left: -92px; transform: rotate(35deg) scaleY(0.92); }
      63%  {              margin-left: -148px;transform: rotate(-25deg) scaleY(0.42); }
      82%  {              margin-left: -205px;transform: rotate(40deg) scaleY(0.88); }
      100% { top: 103%;   margin-left: -255px;transform: rotate(-10deg) scaleY(0.58); }
    }

    @-webkit-keyframes leaf-fall-glide-right {
      0%   { top: -45px; margin-left: 0;     -webkit-transform: rotate(-15deg) scaleY(0.88); }
      21%  {              margin-left: 42px; -webkit-transform: rotate(38deg) scaleY(0.45); }
      43%  {              margin-left: 98px; -webkit-transform: rotate(-32deg) scaleY(0.94); }
      64%  {              margin-left: 155px;-webkit-transform: rotate(30deg) scaleY(0.40); }
      83%  {              margin-left: 212px;-webkit-transform: rotate(-42deg) scaleY(0.86); }
      100% { top: 103%;   margin-left: 260px;-webkit-transform: rotate(12deg) scaleY(0.56); }
    }

    @keyframes leaf-fall-glide-right {
      0%   { top: -45px; margin-left: 0;     transform: rotate(-15deg) scaleY(0.88); }
      21%  {              margin-left: 42px; transform: rotate(38deg) scaleY(0.45); }
      43%  {              margin-left: 98px; transform: rotate(-32deg) scaleY(0.94); }
      64%  {              margin-left: 155px;transform: rotate(30deg) scaleY(0.40); }
      83%  {              margin-left: 212px;transform: rotate(-42deg) scaleY(0.86); }
      100% { top: 103%;   margin-left: 260px;transform: rotate(12deg) scaleY(0.56); }
    }

    @-webkit-keyframes leaf-fall-tumble {
      0%   { top: -45px; margin-left: 0;      -webkit-transform: rotate(0deg) scaleY(1); }
      12%  {              margin-left: 48px;  -webkit-transform: rotate(150deg) scaleY(0.22); }
      27%  {              margin-left: -42px; -webkit-transform: rotate(300deg) scaleY(0.95); }
      41%  {              margin-left: 70px;  -webkit-transform: rotate(470deg) scaleY(0.25); }
      58%  {              margin-left: -65px; -webkit-transform: rotate(650deg) scaleY(0.90); }
      74%  {              margin-left: 88px;  -webkit-transform: rotate(830deg) scaleY(0.28); }
      89%  {              margin-left: -36px; -webkit-transform: rotate(1010deg) scaleY(0.84); }
      100% { top: 103%;   margin-left: 15px;  -webkit-transform: rotate(1150deg) scaleY(0.44); }
    }

    @keyframes leaf-fall-tumble {
      0%   { top: -45px; margin-left: 0;      transform: rotate(0deg) scaleY(1); }
      12%  {              margin-left: 48px;  transform: rotate(150deg) scaleY(0.22); }
      27%  {              margin-left: -42px; transform: rotate(300deg) scaleY(0.95); }
      41%  {              margin-left: 70px;  transform: rotate(470deg) scaleY(0.25); }
      58%  {              margin-left: -65px; transform: rotate(650deg) scaleY(0.90); }

      89%  {              margin-left: -36px; transform: rotate(1010deg) scaleY(0.84); }
      100% { top: 103%;   margin-left: 15px;  transform: rotate(1150deg) scaleY(0.44); }
    }

    @-webkit-keyframes leaf-stream-up {
      0%   { margin-left: 0;      margin-top: 0;     -webkit-transform: rotate(0deg) scaleY(0.82); }
      18%  { margin-left: -18vw;  margin-top: -42px; -webkit-transform: rotate(-190deg) scaleY(0.30); }
      39%  { margin-left: -43vw;  margin-top: 18px;  -webkit-transform: rotate(-410deg) scaleY(0.92); }
      61%  { margin-left: -68vw;  margin-top: -55px; -webkit-transform: rotate(-650deg) scaleY(0.26); }
      82%  { margin-left: -94vw;  margin-top: 12px;  -webkit-transform: rotate(-890deg) scaleY(0.86); }
      100% { margin-left: -123vw; margin-top: -28px; -webkit-transform: rotate(-1120deg) scaleY(0.45); }
    }

    @keyframes leaf-stream-up {
      0%   { margin-left: 0;      margin-top: 0;     transform: rotate(0deg) scaleY(0.82); }
      18%  { margin-left: -18vw;  margin-top: -42px; transform: rotate(-190deg) scaleY(0.30); }
      39%  { margin-left: -43vw;  margin-top: 18px;  transform: rotate(-410deg) scaleY(0.92); }
      61%  { margin-left: -68vw;  margin-top: -55px; transform: rotate(-650deg) scaleY(0.26); }
      82%  { margin-left: -94vw;  margin-top: 12px;  transform: rotate(-890deg) scaleY(0.86); }
      100% { margin-left: -123vw; margin-top: -28px; transform: rotate(-1120deg) scaleY(0.45); }
    }

    @-webkit-keyframes leaf-stream-down {
      0%   { margin-left: 0;      margin-top: 0;     -webkit-transform: rotate(15deg) scaleY(0.88); }
      20%  { margin-left: -22vw;  margin-top: 38px;  -webkit-transform: rotate(-210deg) scaleY(0.28); }
      41%  { margin-left: -47vw;  margin-top: -20px; -webkit-transform: rotate(-445deg) scaleY(0.95); }
      62%  { margin-left: -72vw;  margin-top: 52px;  -webkit-transform: rotate(-680deg) scaleY(0.24); }
      83%  { margin-left: -98vw;  margin-top: -12px; -webkit-transform: rotate(-920deg) scaleY(0.84); }
      100% { margin-left: -126vw; margin-top: 32px;  -webkit-transform: rotate(-1160deg) scaleY(0.42); }
    }

    @keyframes leaf-stream-down {
      0%   { margin-left: 0;      margin-top: 0;     transform: rotate(15deg) scaleY(0.88); }
      20%  { margin-left: -22vw;  margin-top: 38px;  transform: rotate(-210deg) scaleY(0.28); }
      41%  { margin-left: -47vw;  margin-top: -20px; transform: rotate(-445deg) scaleY(0.95); }
      62%  { margin-left: -72vw;  margin-top: 52px;  transform: rotate(-680deg) scaleY(0.24); }
      83%  { margin-left: -98vw;  margin-top: -12px; transform: rotate(-920deg) scaleY(0.84); }
      100% { margin-left: -126vw; margin-top: 32px;  transform: rotate(-1160deg) scaleY(0.42); }

  <script>
    /* ── Календарь ── */
    var calendarNow = new Date();
    var calendarMonth = calendarNow.getMonth();
    var calendarYear = calendarNow.getFullYear();

    function setBackgroundForMonth(month) {
      document.getElementById('bg').style.backgroundImage =
        "url('./background" + (month + 1) + ".jpg')";
    }

    function changeCalendarMonth(direction) {
      calendarMonth += direction;

      if (calendarMonth < 0) {
        calendarMonth = 11;
        calendarYear--;
      } else if (calendarMonth > 11) {
        calendarMonth = 0;
        calendarYear++;
      }

      buildCalendar();
    }

    function buildCalendar() {
      var now   = new Date();
      var today = now.getDate();
      var month = calendarMonth;
      var year  = calendarYear;

      var monthNames = [
        'Январь','Февраль','Март','Апрель','Май','Июнь',
        'Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'
      ];
      document.getElementById('cal-month').textContent = monthNames[month];
      document.getElementById('cal-year').textContent  = year;

      var firstDay    = new Date(year, month, 1).getDay();
      var offset      = (firstDay === 0) ? 6 : firstDay - 1;
      var daysInMonth = new Date(year, month + 1, 0).getDate();

      var grid = document.getElementById('cal-days');
      grid.innerHTML = '';

      var col = 1;
      var row = 1;

      for (var i = 0; i < offset; i++) {
        var empty = document.createElement('span');
        empty.style.msGridColumn = col;
        empty.style.msGridRow    = row;
        col++;
        if (col > 7) { col = 1; row++; }
        grid.appendChild(empty);
      }

      for (var d = 1; d <= daysInMonth; d++) {
        var dow = (offset + d - 1) % 7;
        var isToday =
          d === today &&
          month === now.getMonth() &&
          year === now.getFullYear();
        var isSun = (dow === 6);

        var el = document.createElement('span');
        el.className = 'cal-day' +
          (isToday ? ' today' : '') +
          (isSun && !isToday ? ' sunday' : '');
        el.textContent = d;
        el.style.msGridColumn = col;
        el.style.msGridRow    = row;
        col++;
        if (col > 7) { col = 1; row++; }
        grid.appendChild(el);
      }

      setBackgroundForMonth(month);
    }
    buildCalendar();

    /* ── Часы ── */
    var weekdays = [
      'Воскресенье','Понедельник','Вторник','Среда',
      'Четверг','Пятница','Суббота'
    ];
    var monthsGen = [
      'января','февраля','марта','апреля','мая','июня',
      'июля','августа','сентября','октября','ноября','декабря'
    ];

    function pad(n) { return n < 10 ? '0' + n : '' + n; }

    function updateClock() {
      var now   = new Date();
      var wday  = weekdays[now.getDay()];
      var date  = now.getDate();
      var mon   = monthsGen[now.getMonth()];
      var year  = now.getFullYear();
      var time  = pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
      document.getElementById('clock').textContent =
        wday + ', ' + date + ' ' + mon + ' ' + year + ' г.,  ' + time;
    }
    updateClock();
    setInterval(updateClock, 1000);

    /* ── Разные траектории, клубки и потоки листьев ── */
    var leavesLayer = document.getElementById('leaves-layer');
    var leafColors = [
      'leaf-gold', 'leaf-amber', 'leaf-orange',
      'leaf-red', 'leaf-brown', 'leaf-olive'
    ];
    var leafShapes = ['leaf-shape-lobed', 'leaf-shape-oval'];
    var leafPaths = [
      'leaf-path-slow',
      'leaf-path-slow',
      'leaf-path-spiral-left',
      'leaf-path-spiral-right',
      'leaf-path-glide-left',
      'leaf-path-glide-right',
      'leaf-path-tumble'
    ];
    var activeMovingLeaves = 0;
    var settledLeaves = [];
    var maxMovingLeaves = 44;
    var maxSettledLeaves = 60;

    function removeLeafElement(leaf) {
      if (leaf && leaf.parentNode) {
        leaf.parentNode.removeChild(leaf);
      }
    }

    function setLeafTransform(leaf, value) {
      leaf.style.transform = value;
      leaf.style.WebkitTransform = value;
      leaf.style.msTransform = value;
    }

    function buildLeafElement(size) {
      var leaf = document.createElement('span');
      var surface = document.createElement('span');
      var vein = document.createElement('span');
      var stem = document.createElement('span');
      var colorClass = leafColors[Math.floor(Math.random() * leafColors.length)];
      var shapeClass = leafShapes[Math.floor(Math.random() * leafShapes.length)];

      leaf.leafColorClass = colorClass;
      leaf.leafShapeClass = shapeClass;
      surface.className = 'leaf-surface';
      vein.className = 'leaf-vein';
      stem.className = 'leaf-stem';
      surface.appendChild(vein);
      leaf.appendChild(surface);
      leaf.appendChild(stem);
      leaf.style.width = size + 'px';
      leaf.style.height = Math.round(size * 1.12) + 'px';
      leaf.style.opacity = (0.62 + Math.random() * 0.32).toFixed(2);

      return leaf;
    }

    function getPathDuration(pathClass) {
      if (pathClass === 'leaf-path-slow') {
        return 16000 + Math.floor(Math.random() * 6500);
      }
      if (
        pathClass === 'leaf-path-spiral-left' ||
        pathClass === 'leaf-path-spiral-right'
      ) {
        return 11000 + Math.floor(Math.random() * 5500);
      }
      if (
        pathClass === 'leaf-path-glide-left' ||
        pathClass === 'leaf-path-glide-right'
      ) {
        return 9000 + Math.floor(Math.random() * 4500);
      }
      return 8500 + Math.floor(Math.random() * 4500);
    }

    function settleLeaf(leaf) {
      if (!leaf || !leaf.parentNode || leaf.leafState !== 'falling') {
        return;
      }

      var leafRect = leaf.getBoundingClientRect();
      var landingLeft = leafRect.left;
      var maxLeft = leavesLayer.clientWidth - 8;
      var restingAngle = -85 + Math.floor(Math.random() * 171);

      if (landingLeft < -12) {
        landingLeft = -12;
      } else if (landingLeft > maxLeft) {
        landingLeft = maxLeft;
      }

      leaf.leafState = 'settled';
      activeMovingLeaves--;
      leaf.className =
        'leaf settled-leaf ' + leaf.leafColorClass + ' ' + leaf.leafShapeClass;
      leaf.style.top = 'auto';
      leaf.style.left = landingLeft + 'px';
      leaf.style.marginLeft = '0';
      leaf.style.bottom = Math.floor(Math.random() * 22) + 'px';
      leaf.style.animationDelay = '0ms';
      leaf.style.WebkitAnimationDelay = '0ms';
      setLeafTransform(leaf, 'rotate(' + restingAngle + 'deg)');

      settledLeaves.push(leaf);

      while (settledLeaves.length > maxSettledLeaves) {
        removeLeafElement(settledLeaves.shift());
      }
    }

    function createFallingLeaf(startInsideScreen, forcedLeft, forcedPath, startDelay) {
      if (!leavesLayer || activeMovingLeaves >= maxMovingLeaves) {
        return;
      }

      var size = 12 + Math.floor(Math.random() * 12);
      var leaf = buildLeafElement(size);
      var pathClass = forcedPath ||
        leafPaths[Math.floor(Math.random() * leafPaths.length)];
      var duration = getPathDuration(pathClass);
      var delay = startInsideScreen ?
        -Math.floor(Math.random() * duration) :
        (startDelay || 0);

      leaf.leafState = 'falling';
      leaf.className =
        'leaf falling-leaf ' + leaf.leafColorClass + ' ' +
        leaf.leafShapeClass + ' ' + pathClass;
      leaf.style.left = forcedLeft ||
        (Math.floor(Math.random() * 96) + '%');
      leaf.style.animationDuration = duration + 'ms';
      leaf.style.WebkitAnimationDuration = duration + 'ms';
      leaf.style.animationDelay = delay + 'ms';
      leaf.style.WebkitAnimationDelay = delay + 'ms';

      leavesLayer.appendChild(leaf);
      activeMovingLeaves++;

      setTimeout(function() {
        settleLeaf(leaf);
      }, Math.max(350, duration + delay));
    }

    function createLeafCluster() {
      if (activeMovingLeaves > maxMovingLeaves - 7) {
        return;
      }

      var center = 12 + Math.floor(Math.random() * 76);
      var count = 5 + Math.floor(Math.random() * 3);
      var pathClass = Math.random() < 0.5 ?
        'leaf-path-spiral-left' :
        'leaf-path-spiral-right';

      for (var i = 0; i < count; i++) {
        (function(index) {
          setTimeout(function() {
            var offset = -3 + Math.floor(Math.random() * 7);
            createFallingLeaf(
              false,
              (center + offset) + '%',
              pathClass,
              0
            );
          }, index * 115);
        })(i);
      }
    }

    function removeStreamLeaf(leaf) {
      if (!leaf || leaf.leafState !== 'stream') {
        return;
      }

      leaf.leafState = 'removed';
      activeMovingLeaves--;
      removeLeafElement(leaf);
    }

    function createStreamLeaf(index) {
      if (!leavesLayer || activeMovingLeaves >= maxMovingLeaves) {
        return;
      }

      var size = 11 + Math.floor(Math.random() * 13);
      var leaf = buildLeafElement(size);
      var streamClass = index % 2 === 0 ?
        'leaf-stream-up' :
        'leaf-stream-down';
      var duration = 4800 + Math.floor(Math.random() * 2600);

      leaf.leafState = 'stream';
      leaf.className =
        'leaf stream-leaf ' + leaf.leafColorClass + ' ' +
        leaf.leafShapeClass + ' ' + streamClass;
      leaf.style.top = (8 + Math.floor(Math.random() * 70)) + '%';
      leaf.style.animationDuration = duration + 'ms';
      leaf.style.WebkitAnimationDuration = duration + 'ms';

      leavesLayer.appendChild(leaf);
      activeMovingLeaves++;

      setTimeout(function() {
        removeStreamLeaf(leaf);
      }, duration + 250);
    }

    function createLeafStream() {
      var count = 10 + Math.floor(Math.random() * 5);

      for (var i = 0; i < count; i++) {
        (function(index) {
          setTimeout(function() {
            createStreamLeaf(index);
          }, index * 150 + Math.floor(Math.random() * 180));
        })(i);
      }
    }

    function scheduleLeafCluster() {
      var delay = 13000 + Math.floor(Math.random() * 10000);

      setTimeout(function() {
        createLeafCluster();
        scheduleLeafCluster();
      }, delay);
    }

    function scheduleLeafStream() {
      var delay = 32000 + Math.floor(Math.random() * 23000);

      setTimeout(function() {
        createLeafStream();
        scheduleLeafStream();
      }, delay);
    }

    for (var leafIndex = 0; leafIndex < 14; leafIndex++) {
      createFallingLeaf(true, null, null, 0);
    }

    setInterval(function() {
      createFallingLeaf(false, null, null, 0);
    }, 520);

    scheduleLeafCluster();
    scheduleLeafStream();
  </script>
