    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      font-family: 'Lexend', 'Segoe UI', Tahoma, sans-serif;
      -webkit-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    /* ── Фон ── */
    #bg {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 0;
      background-image: url('./background9.jpg');
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      background-color: #1a1a2e;
    }

    /* ── Менюбар ── */
    #menubar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 30px;
      z-index: 100;
      background: rgba(220, 220, 220, 0.80);
      display: -ms-flexbox;
      display: flex;
      -ms-flex-align: center;
      align-items: center;
      padding: 0 14px;
    }

    #clock {
      position: absolute;
      left: 50%;
      top: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
      font-size: 13px;
      color: #111;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }

    #menubar-icons {
      margin-left: auto;
      display: -ms-flexbox;
      display: flex;
      -ms-flex-align: center;
      align-items: center;
    }
    #menubar-icons svg {
      margin-left: 14px;
      opacity: 0.8;
    }

    /* ── Базовый стиль виджетов ── */
    .widget {
      position: fixed;
      z-index: 10;
      background: rgba(30, 30, 50, 0.62);
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.35);
      font-family: 'Segoe UI', Tahoma, sans-serif;
    }

    /* ── Календарь ── */
    #cal-widget {
      top: 46px;
      left: 20px;
      width: 230px;
      padding: 16px 14px 12px;
    }

    #cal-header {
      display: -ms-flexbox;
      display: flex;
      -ms-flex-pack: justify;
      justify-content: space-between;
      -ms-flex-align: end;
      align-items: flex-end;
      margin-bottom: 10px;
      padding: 0 2px;
    }


    #cal-nav {
      display: -ms-flexbox;
      display: flex;
      -ms-flex-align: center;
      align-items: center;
    }

    .cal-arrow {
      width: 22px;
      height: 22px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      outline: none;
      background: transparent;
      color: rgba(255, 255, 255, 0.72);
      cursor: pointer;
      font-family: Arial, sans-serif;
      font-size: 11px;
      line-height: 22px;
      text-align: center;
    }

    .cal-arrow:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.18);
    }

    #cal-month {
      min-width: 86px;
      text-align: center;
      font-size: 15px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.95);
      letter-spacing: 0.2px;
    }
    #cal-year {
      font-size: 13px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.55);
    }

    #cal-dow {
      display: -ms-flexbox;
      display: flex;
      -ms-flex-pack: distribute;
      justify-content: space-around;
      margin-bottom: 4px;
      font-size: 10px;
      color: rgba(255,255,255,0.4);
    }
    #cal-dow span {
      text-align: center;
      font-size: 10px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.4);
      padding-bottom: 4px;
    }
    #cal-dow span:nth-child(6) { color: rgba(255, 255, 255, 0.5); }
    #cal-dow span:nth-child(7) { color: rgba(255, 100, 100, 0.65); }

    #cal-days {
      display: -ms-grid;
      display: grid;
      -ms-grid-columns: 1fr 1fr 1fr 1fr 1fr 1fr 1fr;
      grid-template-columns: repeat(7, 1fr);
    }

    .cal-day {
      display: -ms-flexbox;
      display: flex;
      -ms-flex-align: center;
      align-items: center;
      -ms-flex-pack: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      margin: 1px auto;
      border-radius: 50%;
      font-size: 12px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.82);
    }
    .cal-day.today {
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      background: rgba(255, 255, 255, 0.30);

    }
    .cal-day.sunday { color: rgba(255, 100, 100, 0.8); }

      left: 20px;

    }

    #qr-caption {

      display: flex;
      -ms-flex-direction: column;
      flex-direction: column;
      -ms-flex-align: center;
      align-items: center;
    }

    #qr-title {
      font-size: 12px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.9);
    }

    #qr-email {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.5);
      margin-top: 3px;
    }

    /* ── Панель приложений ── */
    #app-panel {
      top: 46px;
      right: 20px;
      width: 96px;
      padding: 12px 10px;
      display: -ms-flexbox;
      display: flex;
      -ms-flex-direction: column;
      flex-direction: column;
      -ms-flex-align: center;
      align-items: center;
    }

    #app-panel-2 {
      top: 400px; /* подбери под высоту первой панели */
      right: 20px;
      padding: 12px 10px;
      display: -ms-flexbox;
      display: flex;
      -ms-flex-direction: column;
      flex-direction: column;
      -ms-flex-align: center;
      align-items: center;
    }

    .app-icon {
      pointer-events: auto;
      cursor: pointer;
      text-decoration: none;
      display: -ms-flexbox;
      display: flex;
      -ms-flex-direction: column;
      flex-direction: column;

      align-items: center;
      margin-bottom: 10px;
    }

    .app-icon img {
      width: 56px;
      height: 56px;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.3));
      -webkit-transition: -webkit-transform 0.12s;
      transition: transform 0.12s;
    }

    .app-icon span {
      font-size: 10px;
      color: #fff;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
      margin-top: 4px;
    }


    /* ── Реалистичные падающие и накопившиеся листья ── */
    #leaves-layer {
      position: fixed;
      top: 30px;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 5;
      overflow: hidden;
      pointer-events: none;
    }

    .leaf {
      position: absolute;
      width: 18px;
      height: 21px;
      opacity: 0.88;
      pointer-events: none;
    }

    .leaf-surface {
      position: absolute;
      left: 20%;
      top: 2%;
      width: 62%;
      height: 72%;
      background: currentColor;
      border-radius: 82% 12% 78% 10%;
      box-shadow:
        inset 2px 2px 3px rgba(255, 225, 145, 0.30),
        inset -2px -2px 3px rgba(85, 40, 10, 0.30),
        0 2px 3px rgba(0, 0, 0, 0.22);
      -webkit-transform: rotate(45deg);
      transform: rotate(45deg);
    }

    .leaf-surface:before,
    .leaf-surface:after {
      content: '';
      position: absolute;
      top: 27%;
      width: 72%;
      height: 62%;
      background: currentColor;
      border-radius: 80% 12% 75% 15%;
      box-shadow:
        inset 1px 1px 2px rgba(255, 225, 145, 0.20),
        inset -1px -1px 2px rgba(85, 40, 10, 0.22);
    }

    .leaf-surface:before {
      left: -38%;
      -webkit-transform: rotate(-32deg);
      transform: rotate(-32deg);
    }

    .leaf-surface:after {
      right: -38%;
      -webkit-transform: rotate(32deg);
      transform: rotate(32deg);
    }

    .leaf-shape-oval .leaf-surface {
      left: 14%;
      width: 70%;
      height: 78%;
      border-radius: 95% 10% 92% 8%;
    }

    .leaf-shape-oval .leaf-surface:before,
    .leaf-shape-oval .leaf-surface:after {
      display: none;
    }

    .leaf-vein {
      position: absolute;
      left: 49%;
      top: 9%;
      width: 1px;
      height: 82%;
      background: rgba(90, 48, 15, 0.52);
    }

    .leaf-vein:before,
    .leaf-vein:after {
      content: '';
      position: absolute;
      left: -5px;
      width: 6px;
      height: 1px;
      background: rgba(90, 48, 15, 0.40);
      -webkit-transform-origin: right center;
      transform-origin: right center;
    }

    .leaf-vein:before {
      top: 35%;
      -webkit-transform: rotate(35deg);
      transform: rotate(35deg);
    }

    .leaf-vein:after {
      top: 61%;
      -webkit-transform: rotate(-32deg);
      transform: rotate(-32deg);
    }

    .leaf-stem {
      position: absolute;
      left: 49%;
      top: 67%;
      width: 1px;
      height: 31%;
      background: #70451f;
      -webkit-transform: rotate(-22deg);
      transform: rotate(-22deg);
      -webkit-transform-origin: top center;
      transform-origin: top center;
    }

    .leaf-gold   { color: #c99a32; }
    .leaf-amber  { color: #d17b25; }
    .leaf-orange { color: #bd5b25; }
    .leaf-red    { color: #9e3c2b; }
    .leaf-brown  { color: #79502a; }
    .leaf-olive  { color: #8d812f; }

    .falling-leaf {
      top: -45px;
      -webkit-animation-timing-function: linear;
      animation-timing-function: linear;
      -webkit-animation-iteration-count: 1;
      animation-iteration-count: 1;
      -webkit-animation-fill-mode: both;
      animation-fill-mode: both;
    }

    .leaf-drift-left {
      -webkit-animation-name: realistic-leaf-fall-left;
      animation-name: realistic-leaf-fall-left;
    }

    .leaf-drift-right {
      -webkit-animation-name: realistic-leaf-fall-right;
      animation-name: realistic-leaf-fall-right;
    }

    .settled-leaf {
      top: auto;
      -webkit-animation: none;
      animation: none;
      opacity: 0.92;
    }

    .wind-leaf {
      top: auto;
      -webkit-animation-name: leaf-wind-left;
      animation-name: leaf-wind-left;
      -webkit-animation-timing-function: ease-in;
      animation-timing-function: ease-in;
      -webkit-animation-iteration-count: 1;
      animation-iteration-count: 1;
      -webkit-animation-fill-mode: forwards;
      animation-fill-mode: forwards;
    }

    @-webkit-keyframes realistic-leaf-fall-left {
      0%   { top: -45px; margin-left: 0;     -webkit-transform: rotate(0deg) scaleY(1); }
      18%  {              margin-left: 55px; -webkit-transform: rotate(85deg) scaleY(0.35); }
      38%  {              margin-left: -18px;-webkit-transform: rotate(175deg) scaleY(0.95); }
      60%  {              margin-left: 62px; -webkit-transform: rotate(285deg) scaleY(0.28); }
      80%  {              margin-left: -32px;-webkit-transform: rotate(395deg) scaleY(0.82); }
      100% { top: 103%;   margin-left: 12px; -webkit-transform: rotate(520deg) scaleY(0.52); }
    }

    @keyframes realistic-leaf-fall-left {
      0%   { top: -45px; margin-left: 0;     transform: rotate(0deg) scaleY(1); }
      18%  {              margin-left: 55px; transform: rotate(85deg) scaleY(0.35); }
      38%  {              margin-left: -18px;transform: rotate(175deg) scaleY(0.95); }
      60%  {              margin-left: 62px; transform: rotate(285deg) scaleY(0.28); }
      80%  {              margin-left: -32px;transform: rotate(395deg) scaleY(0.82); }
      100% { top: 103%;   margin-left: 12px; transform: rotate(520deg) scaleY(0.52); }
    }

    @-webkit-keyframes realistic-leaf-fall-right {
      0%   { top: -45px; margin-left: 0;      -webkit-transform: rotate(20deg) scaleY(0.85); }
      20%  {              margin-left: -48px; -webkit-transform: rotate(-95deg) scaleY(0.30); }
      42%  {              margin-left: 28px;  -webkit-transform: rotate(-205deg) scaleY(1); }
      63%  {              margin-left: -58px; -webkit-transform: rotate(-315deg) scaleY(0.34); }
      82%  {              margin-left: 38px;  -webkit-transform: rotate(-405deg) scaleY(0.78); }
      100% { top: 103%;   margin-left: -10px; -webkit-transform: rotate(-530deg) scaleY(0.48); }
    }

    @keyframes realistic-leaf-fall-right {
      0%   { top: -45px; margin-left: 0;      transform: rotate(20deg) scaleY(0.85); }
      20%  {              margin-left: -48px; transform: rotate(-95deg) scaleY(0.30); }
      42%  {              margin-left: 28px;  transform: rotate(-205deg) scaleY(1); }
      63%  {              margin-left: -58px; transform: rotate(-315deg) scaleY(0.34); }
      82%  {              margin-left: 38px;  transform: rotate(-405deg) scaleY(0.78); }
      100% { top: 103%;   margin-left: -10px; transform: rotate(-530deg) scaleY(0.48); }
    }

    @-webkit-keyframes leaf-wind-left {
      0%   { margin-left: 0;      margin-bottom: 0;     -webkit-transform: rotate(0deg) scaleY(1); }
      18%  { margin-left: -80px;  margin-bottom: 75px;  -webkit-transform: rotate(-110deg) scaleY(0.35); }
      48%  { margin-left: -42vw;  margin-bottom: 38px;  -webkit-transform: rotate(-380deg) scaleY(0.90); }
      72%  { margin-left: -76vw;  margin-bottom: 105px; -webkit-transform: rotate(-650deg) scaleY(0.30); }
      100% { margin-left: -120vw; margin-bottom: 145px; -webkit-transform: rotate(-940deg) scaleY(0.70); }
    }

    @keyframes leaf-wind-left {
      0%   { margin-left: 0;      margin-bottom: 0;     transform: rotate(0deg) scaleY(1); }
      18%  { margin-left: -80px;  margin-bottom: 75px;  transform: rotate(-110deg) scaleY(0.35); }
      48%  { margin-left: -42vw;  margin-bottom: 38px;  transform: rotate(-380deg) scaleY(0.90); }
      72%  { margin-left: -76vw;  margin-bottom: 105px; transform: rotate(-650deg) scaleY(0.30); }
      100% { margin-left: -120vw; margin-bottom: 145px; transform: rotate(-940deg) scaleY(0.70); }
    }
  </style>
</head>

      onclick="external.doShellExec('D:\\Program Files\\ASCON\\KOMPAS-3D v19\\Bin\\KOMPAS.Exe')"
      onmouseover="this.querySelector('img').style.transform='scale(1.12)'; this.querySelector('img').style.WebkitTransform='scale(1.12)';"
      onmouseout="this.querySelector('img').style.transform='scale(1)'; this.querySelector('img').style.WebkitTransform='scale(1)';">
      <img src="./icon/kompas.png" alt="КОМПАС-3D" />
      <span>КОМПАС-3D (2)</span>
    </a>
  </div>

  <script>
    /* ── Календарь ── */
    var calendarNow = new Date();
    var calendarMonth = calendarNow.getMonth();
    var calendarYear = calendarNow.getFullYear();

    function setBackgroundForMonth(month) {
      document.getElementById('bg').style.backgroundImage =
        "url('./background" + (month + 1) + ".jpg')";
    }

    function changeCalendarMonth(direction) {
      calendarMonth += direction;

      if (calendarMonth < 0) {
        calendarMonth = 11;
        calendarYear--;
      } else if (calendarMonth > 11) {
        calendarMonth = 0;
        calendarYear++;
      }

      buildCalendar();
    }

    function buildCalendar() {
      var now   = new Date();
      var today = now.getDate();
      var month = calendarMonth;
      var year  = calendarYear;

      var monthNames = [
        'Январь','Февраль','Март','Апрель','Май','Июнь',
        'Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'
      ];
      document.getElementById('cal-month').textContent = monthNames[month];
      document.getElementById('cal-year').textContent  = year;

      var firstDay    = new Date(year, month, 1).getDay();
      var offset      = (firstDay === 0) ? 6 : firstDay - 1;
      var daysInMonth = new Date(year, month + 1, 0).getDate();

      var grid = document.getElementById('cal-days');
      grid.innerHTML = '';

      var col = 1;
      var row = 1;

      for (var i = 0; i < offset; i++) {
        var empty = document.createElement('span');
        empty.style.msGridColumn = col;
        empty.style.msGridRow    = row;
        col++;
        if (col > 7) { col = 1; row++; }
        grid.appendChild(empty);
      }

      for (var d = 1; d <= daysInMonth; d++) {
        var dow = (offset + d - 1) % 7;
        var isToday =
          d === today &&
          month === now.getMonth() &&
          year === now.getFullYear();
        var isSun = (dow === 6);

        var el = document.createElement('span');
        el.className = 'cal-day' +
          (isToday ? ' today' : '') +
          (isSun && !isToday ? ' sunday' : '');
        el.textContent = d;
        el.style.msGridColumn = col;
        el.style.msGridRow    = row;
        col++;
        if (col > 7) { col = 1; row++; }
        grid.appendChild(el);
      }

      setBackgroundForMonth(month);
    }
    buildCalendar();

    /* ── Часы ── */
    var weekdays = [
      'Воскресенье','Понедельник','Вторник','Среда',
      'Четверг','Пятница','Суббота'
    ];
    var monthsGen = [
      'января','февраля','марта','апреля','мая','июня',
      'июля','августа','сентября','октября','ноября','декабря'
    ];

    function pad(n) { return n < 10 ? '0' + n : '' + n; }

    function updateClock() {
      var now   = new Date();
      var wday  = weekdays[now.getDay()];
      var date  = now.getDate();
      var mon   = monthsGen[now.getMonth()];
      var year  = now.getFullYear();
      var time  = pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
      document.getElementById('clock').textContent =
        wday + ', ' + date + ' ' + mon + ' ' + year + ' г.,  ' + time;
    }
    updateClock();
    setInterval(updateClock, 1000);

    /* ── Реалистичные листья, накопление и порывы ветра ── */
    var leavesLayer = document.getElementById('leaves-layer');
    var leafColors = [
      'leaf-gold', 'leaf-amber', 'leaf-orange',
      'leaf-red', 'leaf-brown', 'leaf-olive'
    ];
    var leafShapes = ['leaf-shape-lobed', 'leaf-shape-oval'];
    var leafDrifts = ['leaf-drift-left', 'leaf-drift-right'];
    var activeFallingLeaves = 0;
    var settledLeaves = [];
    var maxFallingLeaves = 32;
    var maxSettledLeaves = 60;
    var windInProgress = false;

    function removeLeafElement(leaf) {
      if (leaf && leaf.parentNode) {
        leaf.parentNode.removeChild(leaf);
      }
    }

    function setLeafTransform(leaf, value) {
      leaf.style.transform = value;
      leaf.style.WebkitTransform = value;
      leaf.style.msTransform = value;
    }

    function settleLeaf(leaf) {
      if (!leaf || !leaf.parentNode || leaf.leafState !== 'falling') {
        return;
      }

      var landingLeft = leaf.offsetLeft;
      var restingAngle = -85 + Math.floor(Math.random() * 171);

      leaf.leafState = 'settled';
      activeFallingLeaves--;
      leaf.className =
        'leaf settled-leaf ' + leaf.leafColorClass + ' ' + leaf.leafShapeClass;
      leaf.style.top = 'auto';
      leaf.style.left = landingLeft + 'px';
      leaf.style.marginLeft = '0';
      leaf.style.bottom = Math.floor(Math.random() * 22) + 'px';
      leaf.style.animationDelay = '0ms';
      leaf.style.WebkitAnimationDelay = '0ms';
      setLeafTransform(leaf, 'rotate(' + restingAngle + 'deg)');

      settledLeaves.push(leaf);

      while (settledLeaves.length > maxSettledLeaves) {
        removeLeafElement(settledLeaves.shift());
      }
    }

    function createLeaf(startInsideScreen) {
      if (!leavesLayer || activeFallingLeaves >= maxFallingLeaves) {
        return;
      }

      var leaf = document.createElement('span');
      var surface = document.createElement('span');
      var vein = document.createElement('span');
      var stem = document.createElement('span');
      var duration = 8000 + Math.floor(Math.random() * 5500);
      var size = 12 + Math.floor(Math.random() * 12);
      var delay = startInsideScreen ? -Math.floor(Math.random() * duration) : 0;
      var colorClass = leafColors[Math.floor(Math.random() * leafColors.length)];
      var shapeClass = leafShapes[Math.floor(Math.random() * leafShapes.length)];
      var driftClass = leafDrifts[Math.floor(Math.random() * leafDrifts.length)];

      leaf.leafState = 'falling';
      leaf.leafColorClass = colorClass;
      leaf.leafShapeClass = shapeClass;
      leaf.className =
        'leaf falling-leaf ' + colorClass + ' ' + shapeClass + ' ' + driftClass;

      surface.className = 'leaf-surface';
      vein.className = 'leaf-vein';
      stem.className = 'leaf-stem';
      surface.appendChild(vein);
      leaf.appendChild(surface);
      leaf.appendChild(stem);

      leaf.style.left = Math.floor(Math.random() * 96) + '%';
      leaf.style.width = size + 'px';
      leaf.style.height = Math.round(size * 1.12) + 'px';
      leaf.style.opacity = (0.62 + Math.random() * 0.32).toFixed(2);
      leaf.style.animationDuration = duration + 'ms';
      leaf.style.WebkitAnimationDuration = duration + 'ms';
      leaf.style.animationDelay = delay + 'ms';
      leaf.style.WebkitAnimationDelay = delay + 'ms';

      leavesLayer.appendChild(leaf);
      activeFallingLeaves++;

      setTimeout(function() {
        settleLeaf(leaf);
      }, Math.max(350, duration + delay));
    }

    function blowLeavesToLeft() {
      if (windInProgress || settledLeaves.length === 0) {
        return;
      }

      var leavesToBlow = settledLeaves.slice(0);
      settledLeaves = [];
      windInProgress = true;

      for (var i = 0; i < leavesToBlow.length; i++) {
        (function(leaf, index) {
          var startDelay = Math.floor(Math.random() * 700) + index * 9;
          var windDuration = 2200 + Math.floor(Math.random() * 1200);

          setTimeout(function() {
            if (!leaf || !leaf.parentNode) {
              return;
            }

            leaf.leafState = 'wind';
            leaf.className =
              'leaf wind-leaf ' + leaf.leafColorClass + ' ' + leaf.leafShapeClass;
            leaf.style.animationDuration = windDuration + 'ms';
            leaf.style.WebkitAnimationDuration = windDuration + 'ms';
            leaf.style.animationDelay = '0ms';
            leaf.style.WebkitAnimationDelay = '0ms';

            setTimeout(function() {
              removeLeafElement(leaf);
            }, windDuration + 250);
          }, startDelay);
        })(leavesToBlow[i], i);
      }

      setTimeout(function() {
        windInProgress = false;
      }, 5000);
    }

    for (var leafIndex = 0; leafIndex < 14; leafIndex++) {
      createLeaf(true);
    }

    setInterval(function() {
      createLeaf(false);
    }, 450);

    setInterval(function() {
      blowLeavesToLeft();
    }, 60000);
  </script>

</body>
